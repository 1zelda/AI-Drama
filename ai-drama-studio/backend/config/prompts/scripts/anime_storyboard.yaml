name: anime_storyboard_generator
type: llm

# 动漫分镜 —— 整条流水线最关键的模板。三个提示词字段喂三个下游节点：
#   image_prompt      → shot_images（首帧）
#   end_frame_prompt  → shot_end_frames（尾帧，可选节点；喂给支持首尾帧的视频模型）
#   video_prompt      → shot_videos（运动描述）
# 外加 subtitle（配音+字幕）与 shot_type（引擎按它选模型、套运动模板）。
#
# 与真人剧分镜最大的区别：动漫允许「演出」，但演出来的是镜头和符号，不是人体大幅动作。
# 当前模型跑大幅肢体动作必融化，所以这里把夸张度从「动作」挪到「机位 + 漫画符号 + 切镜节奏」。
prompt: |
  你是动漫演出家（分镜 + 演出一体），做过番剧 OP 级别的分镜表。
  把下面的剧本拆成 {{shots}} 个镜头，每镜 {{duration}} 秒，竖屏优先。

  剧名：{{script_planner.title}}
  梗概：{{script_planner.synopsis}}
  开篇钩子：{{script_planner.hook}}
  爆点：{{script_planner.twist}}
  结尾：{{script_planner.ending}}
  节拍：{{script_planner.beats}}
  名场面：{{script_planner.iconic_moments}}
  角色设定：{{character_generator.characters}}
  场景设定：{{scene_generator.scenes}}
  画风圣经：{{style_bible}}

  分镜铁律（违反直接导致画面崩坏或成本翻倍）：
  1. 一个镜头只做一件事。video_prompt 里只允许出现一个运动动词，
     禁止「一边…一边…」「然后…接着…」。想要连续动作就拆成两个镜头。
  2. 人物大幅动作一律禁止：转身、奔跑、跳跃、打斗接触、起身、摔倒都不许写。
     需要激烈感时用这三样替代，这也是动漫的正经演出手段：
     - 机位：slow zoom in / push in / tilt up / pan left / tracking shot / orbit
     - 漫画符号：速度线、集中线、闪白帧、背景网点飞散、镜头抖动
     - 切镜节奏：静 → 动的两镜对接（本镜静，下镜突然特写）
  3. 人物镜头优先「固定机位 + 一个微动作」（眨眼、发丝飘动、嘴角上扬、呼吸起伏、
     瞳孔收缩、握紧手指），micro_action 字段就是它。
  4. 名场面（iconic_moments）必须至少占 1 个镜头，且那一镜要用 character_closeup
     或 scene 把画面撑满 —— 这是封面和传播素材。
  5. 同框角色不超过 2 个。第 3 个人进画面，一致性直接掉到五成以下。
  6. image_prompt 用英文，结构固定：
     角色形象锚点（逐字照抄 characters 里该角色的 image_prompt 原文，不改写不省略）
     + 本镜姿势表情 + 场景锚点（逐字照抄 scenes 里对应场景的 image_prompt）
     + 机位与景别 + 本镜特效符号。
     不要写画风词和画质词 —— 系统会在最前面统一拼上 style_token，重复会打架。
  7. end_frame_prompt 也必须是**完整可独立生图**的英文提示词：
     与 image_prompt 保持同一构图、同一人物位置、同一背景，
     只改动「这一镜要发生的那一点变化」（表情推进 / 道具位置 / 光线强弱 / 景别略紧）。
     写成"同上，只改 X"是错的 —— 尾帧要单独生成一次，必须自带全部锚点。
     如果这一镜本来就该完全静止（空镜、纯台词镜头），end_frame_prompt 给空字符串。
  8. video_prompt 用英文，开头必须 "static camera"（除非本镜就是运镜镜头），
     只写机位 + 一个具体变化 + 其余保持静止 + "anime cel shading motion, 5 seconds"。
  9. shot_type 只能从这五个值里选一个（引擎靠它选模型，写错就退化成默认模型）：
     character_closeup 人物面部特写 / character_action 人物全身动作 /
     scene 无人物空镜 / screen_ui 屏幕或道具特写 / fx_transition 纯特效转场。
  10. subtitle 是这一镜的字幕兼配音文本：中文口语短句 12-24 字，能独立听懂。
     旁白镜写旁白，对白镜写「角色名：台词」。不要写镜头说明、不要写括号注释。
  11. 第一镜就要把人抓住；最后一镜留钩子。镜头之间要能顺出情绪递进，
     不许出现两个连续的同景别同机位镜头（会像没剪完）。

  严格输出如下 JSON（不要 markdown 代码块）：
  {
    "shots": [
      {
        "no": 1,
        "shot_type": "character_closeup",
        "characters": ["本镜出现的角色名，无人物则 []"],
        "scene_id": "scene_01",
        "duration": 5,
        "camera": "static camera / slow zoom in / push in / pan left / tilt up / tracking shot / orbit",
        "lighting": "本镜光线，5 字以内，如 逆光剪影",
        "effects": ["速度线", "闪白帧"],
        "micro_action": "一个微动作，如 缓慢眨一次眼",
        "subtitle": "这一镜的字幕兼配音，中文 12-24 字",
        "image_prompt": "english first frame prompt, anchors copied verbatim",
        "end_frame_prompt": "english last frame prompt, same composition with one change, or empty string",
        "video_prompt": "static camera, one specific change, rest completely still, anime cel shading motion, 5 seconds",
        "mood": "情绪，6 字以内"
      }
    ]
  }

config:
  model: deepseek-chat
  temperature: 0.7
  max_tokens: 7000
