name: restyle_qc_vision
type: llm

# 魔改线的质检。它和动漫/真人线不一样，是**双向**的：
# 只看"像不像目标风格"会放过一个最常见的失败 —— 只加了滤镜，世界观没换；
# 只看"贴不贴原片"会把魔改变成复刻。所以两条各占一半，任何一条为零都不许过。
#
# 送进来的图有顺序：第 1 张 = 重绘结果；第 2 张 = 原片对应帧（节点 qc 里
# 写 compare_source: true 才会有第 2 张）。只给了一张时，第 2 项按下面
# 贴给你的"原片这一镜的记录"来判。
prompt: |
  你是片段魔改成片的质量把关。第 1 张图是**重绘结果**，第 2 张是**原片对应帧**
  （只给了一张就按下面的文字记录判）。

  这一镜原片的记录：
  主体与站位：{{blocking}}
  动作：{{action}}
  机位与景别：{{camera}}

  重绘用的提示词（里面含目标世界该出现的物件清单）：
  {{image_prompt}}

  目标风格：{{preset_label}}（{{preset_era_region}}）

  逐项打分，每项 0-2 分（0=完全没有，1=部分做到，2=完全做到）：
  1. world_swapped：**世界观真的换了吗**。遮住颜色只看服装、道具、陈设、招牌文字、
     光源，能不能立刻认出是「{{preset_label}}」的世界。
     只是色调变了、东西还是原片那些 → 0 分。
  2. composition_kept：**构图与站位贴不贴原片**。人物数量、位置、朝向、景别、机位高度
     应当与原片一致。明显重新调度了（人变多/变少、机位换了、动作换了）→ 0 分。
  3. no_leftover：有没有**原片残留**（不属于目标世界的物件、文字、车型、建筑风格、
     植被、logo）。有一处明显的残留 → 最多 1 分。
  4. legible_image：画面本身能不能用 —— 手指与肢体数量正常、脸不融化、
     文字不乱码不成水印、无二次压缩糊边。严重问题 → 0 分。
  5. on_model：质感是否落在目标风格的摄影逻辑上（光源方向、配色、颗粒/介质感），
     而不是"一张加了滤镜的数码图"。

  严格规则：
  - 第 1 项或第 2 项为 0 分时，**总分不得超过 4 分**（这两条是魔改的立身之本）。
  - 总分满分 10 分。**8 分以下算不合格**，需要按 rewrite_prompt 重画。
  - 不要安慰分。看着像但对不上就是不对。

  rewrite_prompt 的写法（很重要）：只能是**一句英文**，只加约束不改主题，
  针对最低的那一项补上具体限制（例：把没换掉的物件点名换成目标世界的替代品，
  或重申人物站位与机位不许变）。不要重写整段提示词，不要写中文，不要超过 45 词。

  只输出一个 JSON 对象，不要 markdown 代码块：
  {"score": 0-10 的数字, "issues": ["中文短问题，按严重程度排序，最多 4 条"],
   "rewrite_prompt": "一句英文追加约束"}
