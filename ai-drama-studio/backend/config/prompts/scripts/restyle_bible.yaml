name: restyle_bible
type: llm

# 魔改线的「世界观圣经」：把 restyle_presets.json 里那条目标风格，
# 针对**这一条具体原片**翻译成可执行的替换清单。
#
# 为什么不能把预设的 positive 直接拼到生图提示词上就完事：
# 那样只会得到"同一条片子加了个滤镜"。世界观是靠道具、服装、招牌文字、
# 光源和建筑撑起来的，必须逐条把原片里看见的东西换成目标世界的替代品，
# 所以下游先要有 reverse_prompt 的如实记录，这里才能出"从什么换成什么"。
#
# 目标风格的各个字段由运行输入带进来（/make 页面从预设库里取），
# 引擎只认扁平键，所以这里全是 {{preset_xxx}}；换成手动跑时也可以自己传。
# 下游引用写 {{style_bible.字段}}；节点 id 是 style_bible。
prompt: |
  你是片段魔改项目的美术指导兼世界观设计。手上有两样东西：
  ① 一条现成视频的如实记录（逆向分镜师给的，只描述了他真正看见的东西）；
  ② 一个目标风格（某种地域/时代/导演讲座）。

  你的任务：把这条片子搬到目标世界里去重拍一遍，**但镜头语言、构图、人物站位、
  动作节拍一律不许动**。改的是世界观，不是剪辑。

  —— 原片记录 ——
  内容梗概：{{reverse_prompt.source_logline}}
  原片风格：{{reverse_prompt.source_style}}
  原片看起来的时代与地域：{{reverse_prompt.source_era_region}}
  在场人物：{{reverse_prompt.people}}
  原片里的可读文字：{{reverse_prompt.replaceable_text}}
  最关键的原片视觉元素：{{reverse_prompt.what_makes_it_what_it_is}}

  —— 目标风格 ——
  名称：{{preset_label}}（{{preset_era_region}}）
  一眼可辨的标志：{{preset_signature}}
  中文风格词：{{preset_positive}}
  英文摄影描述：{{preset_style_token}}
  目标机位规则：{{preset_camera}}
  音轨处理意向：{{preset_audio}}
  建议替换清单：{{preset_displacement}}

  世界观置换铁律（这几条决定成品是"魔改"还是"套滤镜"）：
  1. **认得出测试**：把颜色全部抽掉，只看道具、服装、建筑、招牌文字、车辆、植被，
     观众仍然要能立刻说出"这是{{preset_label}}"。达不到就是没换成功。
  2. 必须逐条产出**替换映射**：原片里真实存在的那个东西 → 目标世界里的替代品。
     不许写"改成更印度风"这种没有落点的空话；写"不锈钢保温杯 → 黄铜小茶壶"。
  3. 目标风格库给的替换建议只是起点。原片里出现、而建议清单没覆盖的东西，
     你要自己补出替代品，并说明为什么这个替代品属于目标世界。
  4. **禁止改的东西**要显式列出来：构图、机位、景别、人物数量与站位、动作、
     镜头长度。模型在重画时会顺手改这些，一旦改了就不是魔改，是重拍。
  5. 肤色与族裔要落到目标地域的真实人群上，但**不许把真人画成漫画化的刻板形象**；
     写"当地普通人的样子"，不写"典型的某族人"。
  6. 文字必须处理：招牌、字幕、屏幕、衣服印字都要给出目标世界的写法
     （换语言/换字体/换内容三选一，并说明选哪个）。
  7. 光是世界观的一部分：把原片的光源方案换成目标世界合理的光
     （例：日剧 → 北向窗的自然散射光；宝莱坞 → 硬热带的直射顶光 + 金色反光板），
     并写清光的方向，下游每一镜都要沿用同一套。
  8. 英文 style_token 只写摄影与美术（介质、镜头、光圈、布光、调色、质感、陈设），
     40-70 词，不许出现 8k / ultra detailed / hyperrealistic 这类画质词。
  9. negative_prompt 要包含两栏：目标世界不该出现的东西（原片残留），
     以及通用劣质项（多余手指、可读文字乱码、水印）。12-20 项，英文小写逗号分隔。
  10. 保留一条"喜感/反差"提示：如果这个置换本身有反差（把办公室变成武侠门派），
      明确指出反差落在哪一处最值钱，让下游把这一处拍清楚；没有反差就写"无"。

  只输出一个 JSON 对象，不要 markdown 代码块：
  {
    "target_label": "{{preset_label}}",
    "style_token": "英文 40-70 词的摄影+美术描述，融合目标世界与原片构图",
    "style_cn": "中文一句话，给团队看的风格说明",
    "negative_prompt": "英文小写逗号分隔，12-20 项",
    "world_rules": ["给每一镜重画时逐条遵守的中文规则，6-9 条，必须具体到物件与光"],
    "props_map": [{"original": "原片里真实出现的物件", "replacement": "目标世界的替代品", "why": "为什么它属于那个世界"}],
    "wardrobe": "在场人物的服装妆发怎么换，逐人说明（用原片里的人物 id）",
    "set_design": "空间/建筑/陈设怎么换，逐场景说明（用原片里的 location 名）",
    "lighting": "目标世界的光源方案：方向、性质、色温，一句话说死，全片沿用",
    "palette": "目标世界的配色，写主色与辅色",
    "text_plan": "画面里的文字怎么处理（换语言/换字体/换成无字招牌），并给出替代内容",
    "camera_rules": ["从目标风格借来的机位与运动规则，3-5 条，与原片镜头不冲突的才写"],
    "must_keep": ["绝对不能改的东西，4-6 条，逐条指名是构图/站位/动作/时长中的哪一个"],
    "audio_plan": "音轨怎么处理：原声保留还是重配、加什么音乐、口型怎么办",
    "funny_lever": "反差最值钱的那一处在哪，怎么把它拍清楚；没有就写'无'",
    "risk": "这次置换最可能翻车的两个地方，以及怎么防"
  }
