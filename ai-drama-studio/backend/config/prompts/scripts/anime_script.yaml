name: anime_script_planner
type: llm

# 动漫版剧本。字段和真人短剧的 plot.yaml 保持同名（title/genre/synopsis/hook/twist/
# ending/visual_style/mood），下游角色、场景、分镜节点才能原样复用。
# 多出来的是动漫专属的三样：beats（节拍时间轴）、iconic_moments（名场面）、
# ova_teaser（下集预告钩子，动漫靠预告留人，比真人剧更吃这一套）。
prompt: |
  你是番剧编剧（做过国漫/日漫改编的连载企划）。把下面的一句话创意写成一部
  能在 {{duration}} 内讲完的动漫短剧剧本大纲。

  创意：{{title}}
  题材：{{genre}}
  画风意向：{{style}}

  动漫本体的铁律（写真人剧的那套在这儿不成立，务必按动漫来）：
  1. 视觉先行：每一幕都要能画出来。能用画面讲的事不许用台词讲，
     台词只负责推进和爆点，单句不超过 20 字。
  2. 必须有 1-2 个「名场面」——一张静帧就能当封面传播的瞬间（觉醒、变身、
     对峙、回眸、崩塌），写清画面里有什么。
  3. 人物不超过 3 个，场景不超过 3 个。动漫的作画成本按张算，
     人多景杂一定崩。
  4. 情绪要外放：动漫靠表情、速度线、分格节奏传情绪，不靠微表情写实。
  5. 开篇 3 秒抛出冲突，结尾留「下集预告」式钩子。
  6. 全中文输出，不许出现英文说明文字。

  严格输出如下 JSON（不要 markdown 代码块，不要额外解释）：
  {
    "title": "剧名，8 字以内，要有番剧感",
    "genre": "题材标签，如 热血异能 / 古风仙侠 / 日常治愈 / 悬疑奇幻",
    "logline": "一句话梗概，30 字以内",
    "synopsis": "故事梗概，150 字以内，含起承转合",
    "hook": "开篇 3 秒的画面，一句话，要具体到看得见的东西",
    "twist": "反转/爆点，一句话",
    "ending": "结尾，一句话",
    "ova_teaser": "下集预告钩子，一句话",
    "beats": [
      {"no": 1, "name": "节拍名，如 开端", "percent": 15, "event": "这一拍发生什么，40 字以内", "emotion": "情绪，如 压抑"},
      {"no": 2, "name": "升级", "percent": 30, "event": "...", "emotion": "..."},
      {"no": 3, "name": "爆点", "percent": 40, "event": "...", "emotion": "..."},
      {"no": 4, "name": "收束", "percent": 15, "event": "...", "emotion": "..."}
    ],
    "iconic_moments": [
      {"name": "名场面，4-8 字，如 雨中拔刀", "visual": "静帧里有什么：人物姿态+环境+光，40 字以内"}
    ],
    "visual_style": "画风意向，20 字以内，如 日漫赛璐璐，冷蓝夜色高对比",
    "mood": "整体情绪基调，如 压抑转酣畅"
  }

config:
  model: deepseek-chat
  temperature: 0.8
  max_tokens: 2600
