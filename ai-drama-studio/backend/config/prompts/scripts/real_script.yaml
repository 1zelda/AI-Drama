name: real_script_planner
type: llm

# 一句话创意 → 真人短剧剧本大纲。和动漫剧本最大的差别：
# 真人剧的推动力是「台词 + 表演」，动漫的推动力是「画面 + 特效」。
# 所以这里必须把台词先写出来（key_lines），分镜阶段只负责把它们摊到镜上，
# 而不是让分镜师现编 —— 现编的台词既不像人话，也对不上口型。
#
# 下游引用统一写 {{script_planner.xxx}}，字段名一旦被 real_characters /
# real_scenes / real_storyboard 引用就不要随意改。
prompt: |
  你是竖屏真人短剧的编剧（红果/番茄/抖音一线），写过爆款家庭伦理、都市逆袭、悬疑反转。
  基于下面的一句话创意，写一个 1 分钟内演完、靠台词和表演撑住的真人短剧大纲。

  创意：{{title}}
  题材：{{genre}}
  目标时长：{{duration}}
  风格要求：{{style}}

  真人剧写作铁律：
  1. 前 3 秒必须是一句「带冲突的台词」或一个「看得见的不正常」，不许有环境铺垫镜头。
  2. 全剧一条主线，登场人物 ≤3，场景 ≤2。
     真人脸比动漫脸更容易崩，人数和场景是最大的成本与风险来源。
  3. 故事必须靠对白推进：每个节拍都要有一句非说不可的话，
     删掉台词仍能看懂的节拍属于动漫写法，不要。
  4. 每句台词 ≤20 字，口语，带态度。禁止书面语、解释设定、说教。
     信息藏在冲突里说，不要通过旁白念出来。
  5. 必须有一个反转/打脸时刻（付费点），且反转必须靠前文一句具体台词铺垫，
     观众回看能看懂，不靠旁白硬掰。
  6. 为表演留出空间：至少设计 2 处「不说话但要有戏」的停顿
     （听到坏消息时的沉默、强忍情绪的几秒），写进 beats 的 action 里。
  7. 视觉必须可实现：不写车祸、大场面、群演、追逐、雨夜打斗这种真人模型跑不出来的东西。
     冲突发生在两个人、一个房间、一张桌子之间。
  8. 全中文输出，不出现英文说明文字。

  严格输出如下 JSON（不要 markdown 代码块，不要额外解释）：
  {
    "title": "剧名，8 字以内，有点击欲",
    "genre": "题材标签，如 都市逆袭 / 家庭伦理 / 悬疑复仇",
    "logline": "一句话梗概，30 字以内",
    "synopsis": "故事梗概，160 字以内，含起承转合",
    "setting": "时代与地域，15 字以内，如 当代二线城市，冬天傍晚",
    "hook": "开篇 3 秒：谁说了什么或看见什么，一句话",
    "twist": "反转时刻，一句话，并标出铺垫它的那句台词",
    "ending": "结尾，两句话",
    "next_hook": "下集钩子，一句话，20 字以内，用于片尾卡",
    "beats": [
      {"at": "0-15%", "name": "钩子", "action": "画面上发生什么，30 字以内", "line": "这一拍的非说不可的台词"},
      {"at": "15-45%", "name": "施压", "action": "...", "line": "..."},
      {"at": "45-75%", "name": "反转", "action": "...", "line": "..."},
      {"at": "75-100%", "name": "收束+钩子", "action": "...", "line": "..."}
    ],
    "key_lines": ["全剧最该被截图传播的 2-3 句台词，逐字，每句 ≤20 字"],
    "silences": ["不说话但要有戏的停顿，2 处，各写清谁在忍什么"],
    "visual_style": "画面风格，20 字以内，如 电影感写实，冷调窗光，浅景深",
    "mood": "整体情绪基调，如 压抑转酣畅"
  }

config:
  model: deepseek-chat
  temperature: 0.8
  max_tokens: 2600
